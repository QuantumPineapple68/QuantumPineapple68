name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"  # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: QuantumPineapple68
          outputs: dist/github-contribution-grid-snake.svg

      - name: push snake svg to the output branch
        run: |
          mkdir -p /tmp/snake-output
          cp dist/github-contribution-grid-snake.svg /tmp/snake-output/
          cd /tmp/snake-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "generate snake animation"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:output
